<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e2e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7b731;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5a623;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)" stroke="#2d3561" stroke-width="2"/>
  <!-- Razor blade - stylized -->
  <path d="M 35 90 Q 30 85 32 78 L 80 28 Q 85 22 92 24 L 96 26 Q 100 28 98 34 L 50 84 Q 46 90 38 90 Z"
        fill="url(#blade)" stroke="#888" stroke-width="1"/>
  <!-- Blade edge highlight -->
  <path d="M 35 88 L 82 30 Q 84 27 88 26"
        fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <!-- Handle -->
  <rect x="30" y="86" width="22" height="8" rx="3" fill="#8B7355" stroke="#6B5335" stroke-width="1"/>
  <!-- Lightbulb / AI glow -->
  <circle cx="92" cy="30" r="12" fill="url(#glow)" opacity="0.9"/>
  <circle cx="92" cy="30" r="8" fill="#fff" opacity="0.3"/>
  <!-- AI sparkle dots -->
  <circle cx="92" cy="20" r="2" fill="#f7b731" opacity="0.8"/>
  <circle cx="102" cy="28" r="1.5" fill="#f7b731" opacity="0.6"/>
  <circle cx="84" cy="22" r="1.5" fill="#f7b731" opacity="0.6"/>
  <!-- Text -->
  <text x="64" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e2e2e2">OCCUM'S</text>
</svg>
